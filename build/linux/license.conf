# Unified Firewall — licensing config.
#
# The presence of THIS FILE is what turns licensing on: with it installed,
# `ufw-nft apply` (enforcement) requires an activated key on this machine.
# Remove it to run ungated.
#
# Activate this machine after install:
#     sudo ufw-nft license activate <YOUR-KEY>
# Check state / re-validate:
#     ufw-nft license status --refresh

# Where the firewall phones home. This is the vendor's Supabase edge-function
# base URL; leave it as shipped unless you self-host the backend.
endpoint=https://bpcylnfjdsjouqoezbpa.supabase.co/functions/v1

# The project's PUBLIC anon key. It is safe to embed (it is public), and the
# Supabase gateway may require it to route requests. Paste the anon key here if
# activation returns an authorization error:
# apikey=

# Optional network timeout for each phone-home (seconds; default 15).
# timeout_secs=15
