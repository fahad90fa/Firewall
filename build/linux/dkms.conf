# DKMS configuration for the Unified Firewall kernel module.
#
# DKMS rebuilds the module against each new kernel the machine boots. Without
# it, a distribution kernel update leaves the machine with a module that will
# not load — and a firewall that fails to load after a routine update is a
# firewall that gets uninstalled rather than fixed.
#
# The module is fail-closed by default, so "did not load" means "not filtering",
# not "blocking everything". That is deliberate: a machine that cannot load its
# firewall should still be reachable so somebody can fix it. The daemon reports
# the missing module loudly, and `ufwctl status` says so in the first line.

PACKAGE_NAME="unified-firewall"
PACKAGE_VERSION="0.1.2"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="ufw"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Rebuild on every kernel install, without asking. A prompt during an
# unattended upgrade is a prompt nobody answers, and the machine reboots into
# a kernel with no firewall module.
AUTOINSTALL="yes"

# The eBPF programs are not built here. DKMS builds kernel modules against
# kernel headers; the eBPF objects need clang with a bpf target and the
# generated rule table, neither of which belongs in a DKMS rebuild triggered by
# a kernel update. They are rebuilt by the daemon's pre-start unit instead,
# which is also where they are pinned.
