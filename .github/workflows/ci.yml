# What CI actually enforces.
#
# The jobs are split by what they can prove rather than by platform, because
# the interesting failures here are cross-platform by construction: a Rust enum
# renumbered without the Swift following, a C decoder that stops agreeing with
# its counterpart. A single job that ran everything would report those as one
# red X.
name: ci

on:
  push:
  pull_request:

jobs:
  # The whole workspace, zero dependencies, on the platform most contributors
  # use. Includes the ABI drift checks and the decoder fuzz tripwire, both of
  # which need only a C compiler.
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The TLS feature changes which code compiles. A cfg-gated path that only
      # builds in one configuration is a path that breaks in the other without
      # anyone noticing until a release.
      - run: cargo test -p ufw-daemon --features tls
      - run: make policies

  # The macOS backend, brought to parity with the other two: not just
  # type-checked, but a decoder that actually runs. `RuleEngine.swift` imports
  # only Foundation, so its decision core — address parsing, CIDR containment,
  # zone classification, staged evaluation, the fail-closed identity asymmetry —
  # compiles into a plain executable and is exercised against hand-checked
  # expectations, the same way the C backends are checked by hosted tests.
  macos-extension:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The extension references the compiled-in policy (`UFWGeneratedPolicy`),
      # which is generated, not committed — so, like the eBPF and kernel-linux
      # jobs, generate it before touching the Swift.
      - run: make generate
      - name: Type-check the full extension
        run: |
          # Not a full Xcode build — that needs a signing identity and a
          # provisioning profile a fork's CI does not have. Type checking the
          # framework-linked files (NetworkExtension, SystemExtension) catches a
          # renamed symbol or a changed signature. The generated policy is
          # included so `UFWGeneratedPolicy` resolves.
          swiftc -typecheck -sdk "$(xcrun --show-sdk-path)" \
                 -target arm64-apple-macos13 \
                 build/generated/macos/UFWPolicy.generated.swift \
                 kernel/macos/NetworkExtension/*.swift \
                 kernel/macos/SystemExtension/*.swift
      - name: Build and run the RuleEngine harness
        run: |
          # The runtime half. RuleEngine.swift has no framework dependency, so it
          # links into a standalone binary with the harness (which supplies its
          # own minimal UFWGeneratedPolicy). The binary exits non-zero, naming
          # the property, if the engine disagrees with a checked expectation.
          #
          # Built -Onone, not -O: a correctness harness gains nothing from
          # optimization, and an optimized build turns a runtime trap (an
          # overflowing conversion, a nil unwrap) into a bare "Trace/BPT trap"
          # with no location, whereas -Onone prints "Fatal error: ...: line N".
          # For a harness whose whole job is to surface such faults, the
          # diagnosable build is the correct one.
          swiftc -Onone -g -sdk "$(xcrun --show-sdk-path)" \
                 -target arm64-apple-macos13 \
                 -o "$RUNNER_TEMP/ruleengine_harness" \
                 kernel/macos/NetworkExtension/RuleEngine.swift \
                 kernel/macos/Tests/RuleEngineHarness.swift
          "$RUNNER_TEMP/ruleengine_harness"
      - run: cargo test --workspace

  # The eBPF programs, through clang's bpf target. Compilation is meaningful
  # verification here in a way it is not for ordinary C: most of what the
  # verifier rejects, it rejects for reasons visible at compile time.
  #
  # The real verifier needs privileges and a live kernel; `make -C
  # kernel/linux/ebpf verify` runs it, and the container job below does.
  ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - run: cargo build --release
      - run: make generate
      - run: make -C kernel/linux/ebpf

  # The kernel module compiles against real headers, and the eBPF programs go
  # through the real verifier. This is the closest thing here to running the
  # thing, and it is still not running it — see docs/development/testing.md.
  kernel-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev linux-headers-$(uname -r)
      - run: cargo build --release
      - run: make generate
      - run: make -C kernel/linux
      - run: sudo make -C kernel/linux check
