# Coverage-guided fuzzing of the ring-0 parsing surface — the code that reads
# attacker-chosen bytes in kernel context and is the highest-risk in the tree.
#
# Two harnesses, because there are two shapes of that risk:
#   * decoders.c    — each protocol decoder sees one buffer.
#   * reassembly.c  — the stream reassembler holds per-flow state across calls
#                     and indexes a fixed buffer with an attacker-influenced
#                     offset, so its bug is one that needs a *sequence* of
#                     segments (an overlap, a gap, a wrapped sequence number).
#
# Two tiers, on purpose:
#   * smoke    — every push and pull request. Builds every harness under the
#                sanitizers and runs a short campaign. It is a tripwire for a
#                harness that no longer compiles (a signature drifting out from
#                under the harness) and for any crash shallow enough to surface
#                in a minute. A PR should not merge a fuzzer that cannot build.
#   * campaign — nightly. Measured in half-hours, with a corpus that persists
#                between runs, it reaches the input a blind mutator never would.
#
# The deterministic tripwire in daemon/tests/dpi_decoder_tests.rs still runs on
# every `cargo test`; this is the sanitized, coverage-guided other half.
name: fuzz

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # Fast, per-PR: prove every harness builds under the sanitizers and survives a
  # short run. Catches harness bit-rot and shallow crashes on the PR itself.
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-decoders
            source: decoders.c
            corpus: corpus
            extra: -I ../kernel/linux/inc
          - name: windows-decoders
            source: decoders.c
            corpus: corpus
            extra: -DUFW_ABI_CHECK -DUFW_FUZZ_WINDOWS -I ../kernel/windows/inc
          - name: reassembly
            source: reassembly.c
            corpus: corpus-reassembly
            extra: -I ../kernel/linux/inc
          - name: automaton
            source: automaton.c
            corpus: corpus-automaton
            seeds: seeds/automaton
            extra: -I ../kernel/linux/inc
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          # The fuzzer/asan static archives live in a version-pinned package;
          # link fails without them. Match whatever clang the runner ships.
          major="$(clang --version | grep -oP 'clang version \K[0-9]+' | head -1)"
          sudo apt-get install -y "libclang-rt-${major}-dev" \
            || sudo apt-get install -y libclang-rt-dev || true
      - name: Build
        run: |
          cd fuzz && mkdir -p "${{ matrix.corpus }}"
          # A target with committed seeds (the automaton table format is too
          # structured for random bytes to reach) starts its corpus from them.
          if [ -n "${{ matrix.seeds }}" ]; then
            find "${{ matrix.seeds }}" -type f ! -name '*.md' \
              -exec cp -n {} "${{ matrix.corpus }}/" \;
          fi
          clang -g -O1 -fsanitize=fuzzer,address,undefined \
                -fno-sanitize-recover=all ${{ matrix.extra }} \
                -o fuzzer "${{ matrix.source }}"
      - name: Smoke campaign
        run: cd fuzz && ./fuzzer "${{ matrix.corpus }}/" -max_len=65536 -max_total_time=60 -print_final_stats=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-smoke-${{ matrix.name }}
          path: fuzz/crash-*
          if-no-files-found: ignore

  # Nightly, long-running: a corpus that survives between runs is the whole
  # value of a campaign. Starting cold every night rediscovers the same shallow
  # paths and never reaches the deep ones.
  campaign:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-decoders
            source: decoders.c
            corpus: corpus
            extra: -I ../kernel/linux/inc
          - name: windows-decoders
            source: decoders.c
            corpus: corpus
            extra: -DUFW_ABI_CHECK -DUFW_FUZZ_WINDOWS -I ../kernel/windows/inc
          - name: reassembly
            source: reassembly.c
            corpus: corpus-reassembly
            extra: -I ../kernel/linux/inc
          - name: automaton
            source: automaton.c
            corpus: corpus-automaton
            seeds: seeds/automaton
            extra: -I ../kernel/linux/inc
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + sanitizer runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          major="$(clang --version | grep -oP 'clang version \K[0-9]+' | head -1)"
          sudo apt-get install -y "libclang-rt-${major}-dev" \
            || sudo apt-get install -y libclang-rt-dev || true

      - uses: actions/cache@v4
        with:
          path: fuzz/${{ matrix.corpus }}
          key: fuzz-corpus-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.name }}-

      - name: Build
        run: |
          cd fuzz && mkdir -p "${{ matrix.corpus }}"
          if [ -n "${{ matrix.seeds }}" ]; then
            find "${{ matrix.seeds }}" -type f ! -name '*.md' \
              -exec cp -n {} "${{ matrix.corpus }}/" \;
          fi
          clang -g -O1 -fsanitize=fuzzer,address,undefined \
                -fno-sanitize-recover=all ${{ matrix.extra }} \
                -o fuzzer "${{ matrix.source }}"

      - name: Campaign
        run: cd fuzz && ./fuzzer "${{ matrix.corpus }}/" -max_len=65536 -max_total_time=1800 -print_final_stats=1

      # A crash that is not kept is a crash that gets rediscovered next month.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.name }}
          path: fuzz/crash-*
          if-no-files-found: ignore
