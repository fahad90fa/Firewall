<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" role="img" aria-label="Unified Firewall — one policy file compiled into kernel-level filtering on Windows, Linux and macOS, with cross-platform equivalence verified at build time.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e1a2b"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#132a45"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { fill:#f1f5f9; font-weight:700; letter-spacing:2px; }
      .tag   { fill:#94a3b8; }
      .sub   { fill:#64748b; }
      .accent{ fill:#38bdf8; }
      .ok    { fill:#34d399; }
      .chipT { fill:#cbd5e1; font-weight:600; }
      .tick  { animation:pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce){ .tick{animation:none;opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#sheen)">
    <animate attributeName="x" values="-1200;1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Wordmark + thesis (always legible; no entrance-hide) -->
  <text class="title" x="66" y="96" font-size="50">UNIFIED FIREWALL</text>
  <text class="tag"   x="68" y="134" font-size="20">one policy file  →  three kernels  →  <tspan class="accent">the same verdict</tspan></text>
  <text class="sub"   x="68" y="164" font-size="14.5">2006-scenario equivalence verified at build time · zero runtime dependencies · 1012 tests</text>

  <!-- Platform chips -->
  <g transform="translate(820,58)" font-size="16">
    <rect x="0"   y="0" width="112" height="36" rx="18" fill="#0f2137" stroke="#24405f"/>
    <text class="ok tick" x="16" y="24">✓</text><text class="chipT" x="38" y="24">Windows</text>
    <rect x="124" y="0" width="92"  height="36" rx="18" fill="#0f2137" stroke="#24405f"/>
    <text class="ok tick" x="140" y="24" style="animation-delay:.4s">✓</text><text class="chipT" x="162" y="24">Linux</text>
    <rect x="228" y="0" width="100" height="36" rx="18" fill="#0f2137" stroke="#24405f"/>
    <text class="ok tick" x="244" y="24" style="animation-delay:.8s">✓</text><text class="chipT" x="266" y="24">macOS</text>
  </g>

  <!-- ==== Animated data path: packets stream through the firewall ==== -->
  <g transform="translate(0,196)">
    <!-- track -->
    <line x1="40" y1="44" x2="1160" y2="44" stroke="#1c2b3f" stroke-width="2"/>
    <!-- the wall, with a lit gate the allowed flow passes through -->
    <g transform="translate(586,4)">
      <rect x="0" y="0"  width="24" height="30" rx="3" fill="url(#wall)"/>
      <rect x="0" y="52" width="24" height="30" rx="3" fill="url(#wall)"/>
      <rect x="0" y="0"  width="24" height="82" rx="3" fill="none" stroke="#38bdf8" stroke-opacity="0.25"/>
      <rect class="tick" x="3" y="33" width="18" height="18" rx="3" fill="#0b3b2e" stroke="#34d399" stroke-opacity="0.6"/>
    </g>

    <!-- allowed packets: pass through the gate, continue to the right -->
    <rect class="ok" width="26" height="12" rx="3" y="38" filter="url(#glow)">
      <animate attributeName="x" values="20;1160" dur="3.0s" begin="0s"   repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="3.0s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect class="ok" width="26" height="12" rx="3" y="38" filter="url(#glow)">
      <animate attributeName="x" values="20;1160" dur="3.0s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="3.0s" begin="1.5s" repeatCount="indefinite"/>
    </rect>

    <!-- blocked packets: stopped at the wall, then dropped -->
    <rect fill="#f87171" width="26" height="12" rx="3" y="14">
      <animate attributeName="x" values="20;560;560" keyTimes="0;0.6;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.7;1" dur="2.2s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect fill="#f87171" width="26" height="12" rx="3" y="62">
      <animate attributeName="x" values="20;560;560" keyTimes="0;0.6;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.5;0.7;1" dur="2.2s" begin="1.4s" repeatCount="indefinite"/>
    </rect>

    <!-- legend -->
    <g font-size="13" transform="translate(40,92)">
      <rect class="ok" x="0" y="-9" width="18" height="9" rx="2"/><text class="sub" x="26" y="0">allowed (signed identity, permitted port)</text>
      <rect fill="#f87171" x="360" y="-9" width="18" height="9" rx="2"/><text class="sub" x="386" y="0">denied at the kernel — dropped, logged, attributed</text>
    </g>
  </g>
</svg>
