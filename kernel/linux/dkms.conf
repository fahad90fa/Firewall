# DKMS build recipe for the Unified Firewall kernel module (ufw.ko).
#
# DKMS copies /usr/src/unified-firewall-<version>/ into its own build tree and
# rebuilds the module for the running kernel — and again automatically after a
# kernel upgrade (AUTOINSTALL). We drive the kernel build system directly with
# the `modules` target so it reads Kbuild (obj-m += ufw.o) and builds ONLY the
# .ko — never the wrapper Makefile's `all`, which would also try to build the
# eBPF objects (clang/bpftool) that are not part of the module.
PACKAGE_NAME="unified-firewall"
PACKAGE_VERSION="0.1.0"

AUTOINSTALL="yes"
REMAKE_INITRD="no"

BUILT_MODULE_NAME[0]="ufw"
DEST_MODULE_LOCATION[0]="/updates"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
