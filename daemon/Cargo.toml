[package]
name = "ufw-daemon"
description = "Unified Firewall control daemon: policy management, identity resolution, logging and the management API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "ufwd"
path = "src/main.rs"

# A userspace kernel-module simulator: serves the control protocol over a Unix
# socket so the daemon connects and the management surface is fully operable
# without loading a kernel module. It filters no traffic; see the module docs.
[[bin]]
name = "ufw-kmod-sim"
path = "src/bin/ufw-kmod-sim.rs"

# A TLS-terminating reverse-proxy WAF: inspects decrypted HTTP against the
# shipped OWASP signatures and forwards clean requests to a backend. The host
# layer's answer to application-layer web attacks on HTTPS; see src/waf.rs.
[[bin]]
name = "ufw-waf"
path = "src/bin/ufw-waf.rs"

[lib]
name = "ufw_daemon"
path = "src/lib.rs"

[dependencies]
ufw-shared = { path = "../shared" }
ufw-policy-lang = { path = "../policy-lang" }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
# ring is already in the tree via rustls; used here (behind `tls`) to VERIFY the
# Ed25519 signature on a fleet bundle — a public-key upgrade to the HMAC that,
# unlike a shared secret, no host can use to forge a bundle another would accept.
ring = { version = "0.17", optional = true }

# Optional TLS for the network-facing management API and the SIEM sink.
#
# Off by default, and that default is the point. The workspace is otherwise
# dependency-free because everything in it lands in the trusted computing base
# of a kernel-mode filtering decision, and `cargo build` keeps that property.
#
# But the alternative to a vetted TLS library is a hand-written one, and
# hand-rolled crypto in a security product is strictly worse than no TLS at
# all. So TLS is a build-time opt-in: an operator who needs the management API
# on a routable address accepts rustls and its tree, and one who terminates at
# a proxy or stays on loopback pays nothing.
#
#   cargo build                    zero dependencies
#   cargo build --features tls     TLS termination, per the deployment docs
#
# The daemon refuses to start if the configuration asks for TLS and the binary
# was built without it, rather than silently serving plaintext.
[features]
default = []
tls = ["dep:rustls", "dep:ring"]
